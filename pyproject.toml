[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-gateway"
version = "0.1.0"
description = "A thin comms gateway giving agentic applications first-class Google Chat identities: named-webhook delivery now, a two-way Chat app via Pub/Sub next. Owns transport, identity, and inbound routing — never an application's message schema."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mark Mackelprang" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "google-auth>=2.30",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
