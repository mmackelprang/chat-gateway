# Identity + app registry. Copy to registry.yaml (gitignored) and edit.
#
# RULES (CLAUDE.md):
# - This file holds env-var NAMES, never secret values (webhook URLs embed
#   key+token; API keys are credentials).
# - The gateway owns transport + identity + routing. It never owns an
#   application's message schema — apps send rendered payloads.
#
# identities: who a message can appear FROM.
#   mode: webhook  -> tier 1, one-way; the URL's webhook was created in the
#                     Chat UI with this display name + avatar.
#   mode: app      -> tier 2, two-way; sent via the Chat API as the gateway's
#                     Chat app (needs Google Cloud setup — docs/).
#   space: the Chat space id ("spaces/XXXX") this identity posts into.
#          Required for mode:app sends and for routing inbound replies back
#          to the owning app(s); optional for webhook-only identities.
#
# apps: who may SEND. Each app authenticates with its own API key and may
#   only use the identities listed for it.

identities:
  pm-familyworkspace:
    display: "PM · familyworkspace"
    channel: google_chat
    mode: webhook
    webhook_url_env: GOOGLE_CHAT_WEBHOOK_URL__FAMILYWORKSPACE__PM
    space: ""            # spaces/XXXX — fill once the space exists

  job-hunter:
    display: "Job Hunter"
    channel: google_chat
    mode: webhook
    webhook_url_env: GOOGLE_CHAT_WEBHOOK_URL__JOB_HUNTER
    space: ""

  aitrader-alerts:                 # phone-visible space — loud
    display: "aitrader"
    channel: google_chat
    mode: webhook
    webhook_url_env: GOOGLE_CHAT_WEBHOOK_URL__AITRADER_ALERTS
    space: ""

  aitrader-reports:                # quiet reports space
    display: "aitrader reports"
    channel: google_chat
    mode: webhook
    webhook_url_env: GOOGLE_CHAT_WEBHOOK_URL__AITRADER_REPORTS
    space: ""

apps:
  aiteam-harness:
    key_env: CHAT_GATEWAY_API_KEY__AITEAM_HARNESS
    identities: [pm-familyworkspace]
    # Inbound was on only because `true` is the DEFAULT — this app never asked
    # for it. It has no callback_url, no allowed_users, and CLAUDE.md registers
    # it as a notify.py transport, i.e. a SEND-side integration. Hard rule #6 is
    # default-deny in spirit; this makes it so in fact, and no FURTHER content
    # from that space reaches disk: an opted-out owner's event is discarded
    # entirely — it cannot even land under `_unrouted`, because that fallback
    # only fires for a space with NO owner. (Forward-looking only. Audit files
    # already written under the old default are not pruned by this line.)
    #
    # A DEFAULT CORRECTED, NOT A VERDICT about this consumer. Reversible in this
    # one line if aiteam ever wants inbound.
    #
    # ⚠ 2026-08-31 (CG-88): `true` IS NO LONGER THE DEFAULT. The loader denies
    # when the key is absent, so the paragraph above is now a dated record of
    # why this line was written rather than a description of what happens
    # without it. The line STAYS: the default makes silence safe, it does not
    # make silence good, and a template that states nothing teaches the next
    # operator to state nothing. `load_registry` now reports any app that
    # leaves the posture to it — `inbound_defaulted`, on `/healthz` and on
    # `python3 -m chat_gateway check`.
    allow_inbound: false

  job-hunter:
    key_env: CHAT_GATEWAY_API_KEY__JOB_HUNTER
    identities: [job-hunter]
    # The one tenant here that genuinely wants inbound, and until 2026-08-31 it
    # got it the way `aiteam-harness` did — by saying nothing while the default
    # said yes. Written now (CG-88), because the default denies and this
    # template is what a fresh deployment copies: silence here would ship a
    # jobhunt whose callback path is off, differing from the live registry in a
    # way nothing would announce.
    allow_inbound: true

  # An "agent" tenant for the MCP surface (CG-80): an ordinary registered app
  # whose key lives in an MCP client's config rather than in a program. It is a
  # tenant like any other — per-app key, explicit identity allowlist, hard rule
  # #4 unchanged. The MCP tool's `identity` enum is built from the list below,
  # so an agent cannot even FORM a call naming an identity not written here.
  #
  # `allow_inbound: false` and it is WRITTEN, not defaulted (CG-61's lesson).
  # There is no MCP inbound tool, so inbound would be unreachable through that
  # surface anyway; saying it explicitly means the registry states the intent
  # rather than leaving it to a loader default.
  #
  # ⚠ REGISTERING THIS FOR REAL IS AN OPERATOR ACTION, NOT A PR. The live
  # `config/registry.yaml` is gitignored and the key is a new secret, so this
  # example is a template and nothing more. Until an operator mints a key,
  # writes the entry and restarts, the MCP surface has no caller.
  #
  # ^ Still true of any FRESH deployment, which is why it stays. On the NAS it
  # was DONE on 2026-08-11 (docs/deploy/nas.md §10) — key minted over stdin,
  # this block written into the live registry, `GATEWAY_ENABLE_MCP` set — and
  # the surface has since delivered a real message. Read the sentence above as
  # instructions to an operator, never as the current state of a box.
  #
  # ⚠ And choose the `identities:` list deliberately rather than by copying.
  # Every identity granted here becomes model-addressable to whoever holds this
  # key — which is why this example grants ONE, and not, say, an aitrader
  # identity. That consequence is recorded in the CG-80 spec §7.5 and D7; it is
  # outbound only and touches no inbound guarantee, but it is a real choice and
  # this line is where it gets made.
  #
  # ⚠ THAT CHOICE WAS MADE, DELIBERATELY, ON THE LIVE BOX — and it is the only
  # control there is. D7 declined a registry `allow_mcp:` flag, so this list is
  # the whole of what narrows an MCP caller. `aitrader-alerts` and
  # `aitrader-reports` were NOT granted, and the refusal was then observed on
  # the wire: "app 'agent-mcp' may not send as 'aitrader-alerts'". Adding a line
  # here later is not a config edit; it is widening a tenant's
  # model-addressable surface.
  agent-mcp:
    key_env: CHAT_GATEWAY_API_KEY__AGENT_MCP
    identities: [pm-familyworkspace]
    allow_inbound: false

  # The aitrader consumer contract (docs/consumers/aitrader.md):
  # notify + dead-man only; NO inbound control path — enforced, not omitted.
  aitrader:
    key_env: CHAT_GATEWAY_API_KEY__AITRADER
    identities: [aitrader-alerts, aitrader-reports]
    allow_inbound: false           # hard rule #6: no Chat input ever reaches this consumer
    routes:                        # (severity -> identity) for /v1/notify
      alert: aitrader-alerts
      warning: aitrader-reports
      info: aitrader-reports
